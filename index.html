<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI C++ IDE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}
body{
    background:#1e1e1e;
    color:#fff;
    height:100vh;
    display:flex;
    flex-direction:column;
}
header{
    background:#252526;
    padding:10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}
.container{
    display:flex;
    flex:1;
}
.editor-panel{
    flex:2;
    display:flex;
    flex-direction:column;
}
#editor{
    flex:1;
    width:100%;
    background:#1e1e1e;
    color:#dcdcdc;
    border:none;
    outline:none;
    padding:15px;
    resize:none;
    font-size:15px;
    font-family:Consolas,monospace;
}
.toolbar{
    background:#333;
    padding:10px;
    display:flex;
    gap:10px;
}
button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#0078d4;
    color:white;
}
button:hover{
    background:#0094ff;
}
.ai-panel{
    width:340px;
    background:#252526;
    display:flex;
    flex-direction:column;
    border-left:2px solid #444;
}
.ai-header{
    padding:12px;
    background:#333;
    text-align:center;
    font-weight:bold;
}
#prompt{
    margin:10px;
    min-height:90px;
    resize:vertical;
    background:#1b1b1b;
    color:white;
    border:1px solid #555;
    padding:10px;
}
#aiOutput{
    flex:1;
    padding:10px;
    overflow:auto;
    background:#1b1b1b;
    white-space:pre-wrap;
}
.status{
    background:#111;
    padding:8px;
    font-size:12px;
}
</style>
</head>
<body>

<header>🤖 AI C++ IDE</header>

<div class="container">

<div class="editor-panel">

<div class="toolbar">
<button onclick="newFile()">New</button>
<button onclick="saveCode()">Save</button>
<button onclick="loadCode()">Load</button>
<button onclick="copyCode()">Copy</button>
</div>

<textarea id="editor">
#include <iostream>

int main()
{
    std::cout << "Hello World!";
    return 0;
}
</textarea>

<div class="status">
Language: C++17 | Local IDE Demo
</div>

</div>

<div class="ai-panel">

<div class="ai-header">
AI Assistant
</div>

<textarea id="prompt"
placeholder="Ask AI...
Example:
Create a C++ vector example"></textarea>

<button style="margin:10px;" onclick="askAI()">
Generate
</button>

<div id="aiOutput">
AI responses appear here...
</div>

</div>

</div>

<script>
function newFile(){
    document.getElementById("editor").value="";
}

function saveCode(){
    const code=document.getElementById("editor").value;

    const blob=new Blob([code],{
        type:"text/plain"
    });

    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="main.cpp";
    a.click();
}

function loadCode(){
    const input=document.createElement("input");
    input.type="file";

    input.onchange=e=>{
        const file=e.target.files[0];
        const reader=new FileReader();

        reader.onload=function(ev){
            document.getElementById("editor").value=
            ev.target.result;
        }

        reader.readAsText(file);
    }

    input.click();
}

function copyCode(){
    navigator.clipboard.writeText(
      document.getElementById("editor").value
    );
    alert("Code copied!");
}

function askAI(){

    let q=document.getElementById("prompt").value.toLowerCase();
    let out=document.getElementById("aiOutput");

    if(q.includes("vector")){
        out.textContent=
`#include <vector>
#include <iostream>

int main()
{
    std::vector<int> nums={1,2,3,4};

    for(int n : nums)
        std::cout << n << std::endl;
}`;
    }
    else if(q.includes("class")){
        out.textContent=
`class Person
{
public:
    std::string name;

    Person(std::string n)
    {
        name=n;
    }
};`;
    }
    else if(q.includes("sort")){
        out.textContent=
`#include <algorithm>
std::sort(v.begin(), v.end());`;
    }
    else{
        out.textContent=
`AI Suggestion:

- Create classes for modular design
- Use std::vector instead of arrays
- Prefer smart pointers
- Use C++17 features where possible

(Offline Demo AI)`;
    }
}
</script>

</body>
</html>
